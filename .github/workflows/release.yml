name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

# softprops/action-gh-release 需要写权限（2023 后新建仓库的 token 默认只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test & build plugin zip
        run: ./gradlew test buildPlugin --no-daemon

      - name: Verify plugin compatibility (242 baseline + recent)
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload artifact (branch build)
        if: startsWith(github.ref, 'refs/tags/') != true
        uses: actions/upload-artifact@v4
        with:
          name: zcode-idea-plugin
          path: build/distributions/*.zip

      - name: Create GitHub Release with zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
